[package]
name = "peers-broker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "peers-broker"
path = "src/main.rs"

[features]
# SQLite queda tras feature flag (Redis es el default). Compilar con
# `--features sqlite` da el binario 100% autocontenido (decisión de Max).
default = []
sqlite = ["dep:rusqlite"]

[dependencies]
peers-core = { path = "../peers-core" }
axum = "0.8"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
time = { workspace = true }
async-trait = { workspace = true }
# Persistencia por defecto: Redis.
deadpool-redis = { workspace = true }
# GitHub Issues (degradación graciosa). rustls, sin OpenSSL nativo.
octocrab = { workspace = true }
# SQLite solo si se activa la feature.
rusqlite = { workspace = true, optional = true }
# Detección de PID vivo (kill(pid,0)) para resolver colisión de id entre peers locales.
libc = "0.2"
# Puente WhatsApp (Evolution API): rustls, mismo criterio que peers-client/peers-tui/peers-desktop
# (sin OpenSSL nativo). Solo lo usa whatsapp.rs (enviar_texto); nadie más en el broker necesita
# un cliente HTTP saliente.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Decodificar el `base64` de `getBase64FromMediaMessage` (adjuntos de WhatsApp: imagen/documento/
# audio). E-22 permite deps externas para algo tan puntual como esto.
base64 = "0.22"
# CSPRNG del SO para el secreto de sesión (E-10, anti-spoofing del de_id). Ya estaba en el árbol
# como dep transitiva; se declara directa y se fija a 0.2 (API `getrandom::getrandom(&mut buf)`)
# para no depender de la resolución entre 0.2/0.3/0.4 del lock. E-22 permite deps externas.
getrandom = "0.2"
# Bitácora de acciones (RFC registro-acciones / ADR-001): SQLx con FK reales en un fichero
# SQLite PROPIO, independiente del backend (Redis/rusqlite). Las CONSULTAS son dinámicas
# (query/bind, nunca query!): nadie necesita DATABASE_URL ni .sqlx/ para compilar. La feature
# "macros" está SOLO por `sqlx::migrate!` (embebe migrations/ en el binario con checksums;
# no activa validación contra una BD). Dep pedida por Max.
# Sin conflicto de links: comparte libsqlite3-sys 0.30 con rusqlite 0.32 (verificado).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

[dev-dependencies]
tokio = { workspace = true }
